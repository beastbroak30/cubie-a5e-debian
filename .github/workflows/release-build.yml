name: Checks & Release

# Image build is host-side by design: WSL2 builds the 4 GiB .img and the 197 MB
# firmware bundle, then uploads release assets with `gh release upload`.
# Do not add a fake build job here. CI runs checks only, plus release on v*.*.*.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, syntax and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans full history; tags arrive with it. Needed here only.
          fetch-depth: 0

      - name: Secret leak audit (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal repo: no license required. Unset secret is harmless.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Pin map JSON integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json

          with open('docs/cubie-a5e-pinmap.json', encoding='utf-8') as fh:
              data = json.load(fh)
          pins = data.get('pins')
          assert isinstance(pins, list), 'pinmap has no pins list'
          assert len(pins) == 40, f'pinmap must describe 40 header pins, got {len(pins)}'
          print('pinmap: 40 pins, OK')
          PY

      - name: Shell syntax (bash -n) for tracked scripts
        run: |
          set -euo pipefail
          files=$(git ls-files -- '*.sh')
          if [ -z "$files" ]; then
            echo 'no tracked shell scripts found' >&2
            exit 1
          fi
          count=0
          while IFS= read -r f; do
            bash -n "$f"
            count=$((count + 1))
          done <<< "$files"
          echo "bash -n: $count files OK"

      - name: Python syntax for cubie-ota
        run: |
          set -euo pipefail
          test -f ota/cubie-ota
          python3 -m py_compile ota/cubie-ota
          echo 'cubie-ota compiles'

      - name: systemd unit headers
        run: |
          set -euo pipefail
          shopt -s nullglob
          units=(ota/*.service ota/*.timer)
          if [ "${#units[@]}" -eq 0 ]; then
            echo 'no systemd units found' >&2
            exit 1
          fi
          for u in "${units[@]}"; do
            grep -q '^\[Unit\]' "$u" || { echo "missing [Unit] in $u" >&2; exit 1; }
            grep -qE '^\[(Service|Timer)\]' "$u" || { echo "missing [Service] or [Timer] in $u" >&2; exit 1; }
          done
          echo "unit headers OK: ${#units[@]} files"

      - name: apt hook and OTA config sanity
        run: |
          set -euo pipefail
          for f in ota/99cubie-ota ota/cubie-ota.conf; do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done
          grep -q 'cubie-ota check' ota/99cubie-ota
          grep -q '^repo=' ota/cubie-ota.conf
          grep -q '^asset=' ota/cubie-ota.conf
          grep -q '^manifest=' ota/cubie-ota.conf
          echo 'OTA config OK'

  release:
    name: Create release (tag builds only)
    needs: checks
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No tags needed here: release is created through the GitHub API.
      - uses: actions/checkout@v4

      - name: Resolve manifest path from tag
        id: paths
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest="output/v${version}/cubie-ota.json"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "manifest=${manifest}"
          } >> "$GITHUB_OUTPUT"
          echo "tag=${tag} version=${version} manifest=${manifest}"

      - name: Verify OTA manifest matches the tag
        env:
          MANIFEST: ${{ steps.paths.outputs.manifest }}
          VERSION: ${{ steps.paths.outputs.version }}
        run: |
          set -euo pipefail
          test -f "$MANIFEST" || { echo "missing tracked manifest: $MANIFEST" >&2; exit 1; }
          git ls-files --error-unmatch "$MANIFEST" >/dev/null 2>&1 || {
            echo "manifest not tracked: $MANIFEST" >&2
            exit 1
          }
          python3 - "$MANIFEST" "$VERSION" <<'PY'
          import json
          import re
          import sys

          manifest_path, version = sys.argv[1], sys.argv[2]
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), \
              f'tag version is not x.y.z: {version}'
          with open(manifest_path, encoding='utf-8') as fh:
              m = json.load(fh)
          assert m.get('version') == version, \
              f"manifest version {m.get('version')} != tag version {version}"
          digest = m.get('sha256', '')
          assert re.fullmatch(r'[0-9a-f]{64}', digest), \
              'sha256 must be 64 lowercase hex chars'
          assert m.get('asset') == 'cubie-a5e-firmware.tar.zst', \
              f"unexpected manifest asset: {m.get('asset')}"
          assert m.get('dtb'), 'manifest has no dtb'
          print(f'manifest ok: {m["version"]} {digest[:16]}')
          PY

      - name: Create GitHub release with manifest attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.paths.outputs.tag }}
          name: "Radxa Cubie A5E - Debian 12 arm64 ${{ steps.paths.outputs.tag }}"
          body_path: docs/OTA.md
          draft: false
          prerelease: false
          # Throws before release() runs if the manifest is absent.
          fail_on_unmatched_files: true
          files: ${{ steps.paths.outputs.manifest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm manifest asset is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.paths.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name' | grep -qx 'cubie-ota.json'
          echo 'manifest asset confirmed on release'

      - name: Print host-side asset upload command
        env:
          TAG: ${{ steps.paths.outputs.tag }}
          VERSION: ${{ steps.paths.outputs.version }}
        run: |
          set -euo pipefail
          cat <<EOF
          Release ${TAG} is open. The OTA manifest is already attached.

          From the WSL2 build host (GitHub caps one asset at 2 GB, so the
          uncompressed .img is never uploaded):

            gh release upload ${TAG} output/cubie-a5e-lite-arm64.img.gz output/cubie-a5e-lite-arm64.img.gz.sha256 output/v${VERSION}/cubie-a5e-firmware.tar.zst --clobber

          EOF
