# /etc/cubie-ota.conf - firmware OTA settings for the Radxa Cubie A5E image.
# Firmware = kernel Image + board dtb + /lib/modules. Bootloader is never updated.

repo=beastbroak30/cubie-a5e-debian
asset=cubie-a5e-firmware.tar.zst
manifest=cubie-ota.json
release_file=/etc/cubie-a5e-release
max_attempts=3
keep_slots=2
