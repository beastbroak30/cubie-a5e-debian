name: Checks & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, syntax and secret audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret leak audit (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin map JSON integrity
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open('docs/cubie-a5e-pinmap.json'))
          assert 'pins' in data, 'pinmap has no pins'
          assert len(data['pins']) == 40, 'pinmap must describe 40 header pins'
          print('pinmap: 40 pins, OK')
          PY

      - name: Shell syntax (bash -n) for every tracked script
        run: |
          set -e
          mapfile -t files < <(git ls-files '*.sh')
          for f in "${files[@]}"; do
            bash -n "$f" || { echo "syntax error: $f"; exit 1; }
          done
          echo "bash -n: ${#files[@]} files OK"

      - name: Python syntax for cubie-ota
        run: |
          python3 -m py_compile ota/cubie-ota
          echo "cubie-ota compiles"

      - name: systemd unit headers
        run: |
          for u in ota/*.service ota/*.timer; do
            grep -q '^\[Unit\]' "$u" || { echo "missing [Unit] in $u"; exit 1; }
            grep -q '^\[\(Service\|Timer\)\]' "$u" || { echo "missing section in $u"; exit 1; }
          done
          echo "unit files OK"

      - name: apt hook and OTA config sanity
        run: |
          test -f ota/99cubie-ota
          grep -q 'cubie-ota check' ota/99cubie-ota
          grep -q '^repo=' ota/cubie-ota.conf
          echo "ota config OK"

  release:
    name: Create release (tag builds only)
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The image (933 MB gz) and the firmware bundle (197 MB) are host-built and
      # uploaded from the build machine with `gh release upload`: this job only
      # validates the tracked manifest and opens the release.
      - name: Verify OTA manifest matches the tag
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          f="output/v$tag/cubie-ota.json"
          test -f "$f" || { echo "missing $f"; exit 1; }
          python3 - "$f" "$tag" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          tag = sys.argv[2]
          assert m['version'] == tag, f"manifest version {m['version']} != {tag}"
          assert len(m['sha256']) == 64, 'sha256 must be 64 hex chars'
          assert m['asset'].endswith('.tar.zst')
          print(f"manifest ok: {m['version']} {m['sha256'][:16]}")
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Radxa Cubie A5E - Debian 12 arm64 ${{ github.ref_name }}"
          body_path: docs/OTA.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            output/v*/cubie-ota.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remind about host-side assets
        run: |
          cat <<EOF
          Release ${GITHUB_REF_NAME} created.

          Upload the binaries from the build host (GitHub caps each asset at 2 GB,
          so the 4 GiB .img is never attached, only the .img.gz):

            gh release upload ${GITHUB_REF_NAME} \\
              output/cubie-a5e-lite-arm64.img.gz \\
              output/cubie-a5e-lite-arm64.img.gz.sha256 \\
              output/v${GITHUB_REF_NAME#v}/cubie-a5e-firmware.tar.zst \\
              output/v${GITHUB_REF_NAME#v}/cubie-ota.json --clobber
          EOF
