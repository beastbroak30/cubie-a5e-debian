# /etc/cubie-ota.conf - firmware OTA settings for the Radxa Cubie A5E image.
# Firmware = kernel Image + board dtb + /lib/modules. Bootloader is never updated.
#
# Format: one plain key=value per line, no quotes, no spaces around '='.
# Lines starting with '#' are comments and blank lines are ignored.
# Unknown keys are ignored. The values below also match the built-in defaults
# in /usr/bin/cubie-ota, so deleting a line falls back to that default.

# GitHub "owner/repo" whose releases carry the firmware bundle.
# Read by: check, apply.
repo=beastbroak30/cubie-a5e-debian

# Release asset name of the firmware bundle:
# Image + sun55i-a527-cubie-a5e.dtb (+ optional modules.tar.zst).
# Read by: apply.
asset=cubie-a5e-firmware.tar.zst

# Release asset name of the JSON manifest. It carries "sha256" (checked before
# extraction) and "dtb" (the dtb name written into extlinux).
# Read by: check, apply.
manifest=cubie-ota.json

# File holding VERSION=<x.y.z> for the installed firmware.
# Rewritten by: confirm, rollback. Read by: status, check.
release_file=/etc/cubie-a5e-release

# Boots allowed on a new slot before boot-guard gives up and rolls back.
# Read by: status, boot-guard. Keep it >= 2.
max_attempts=3

# Slots kept under /boot/ota after a confirmed boot.
# The current and the previous slot are always protected from pruning.
# Read by: confirm. Keep it >= 2 so a rollback target always exists.
keep_slots=2

# Architecture tag of the firmware bundle. Informational for now: the CLI
# records the expected target but downloads release assets by name only.
# Read by: (reserved) - documented so the parser keys are not a surprise.
arch=arm64

# Optional GitHub token file. One line, a classic PAT with public_repo scope.
# Raises the API limit from 60 to 5000 requests/hour. Missing file is fine.
# Read by: check, apply.
#token_file=/etc/cubie-ota.token

# Space thresholds in MiB checked before a download and before staging a slot.
# Defaults: bundle_mb=200, slot_mb=210. The CLI raises them to the asset size
# from the release API when it is larger.
# Read by: apply.
#bundle_mb=200
#slot_mb=210
